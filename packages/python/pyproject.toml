[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abbrev"
version = "0.1.0"
description = "Pure, configurable identifier abbreviation without dictionaries"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abbrev = ["py.typed"]
