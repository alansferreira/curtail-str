[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curtail-str"
version = "0.1.3"
description = "Pure, configurable identifier abbreviation without dictionaries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alan Ferreira"}]

[project.urls]
Homepage = "https://github.com/alansferreira/curtail-str"
Repository = "https://github.com/alansferreira/curtail-str"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curtail_str = ["py.typed"]
