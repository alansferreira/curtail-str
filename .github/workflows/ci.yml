name: Verify packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-version

  shell:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s packages/shell/tests -v
      - name: Test Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $actual = & .\packages\shell\curtail-str.ps1 -Text "codigo-do-cliente-ativo-no-estoque"
          if ($actual -ne "cdg-clnt-atv-estq") { throw "PowerShell 5.1 contract failed" }
      - run: python scripts/package_shell.py
      - uses: actions/upload-artifact@v4
        with:
          name: curtail-str-shell-${{ matrix.os }}
          path: packages/shell/dist/

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: packages/node
      - run: npm test && npm run typecheck && node test/package-smoke.cjs
        working-directory: packages/node

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e packages/python build
      - run: python -m unittest discover -s packages/python/tests -v
      - run: python -m build packages/python
      - run: python scripts/check_python_distribution.py packages/python/dist/*.whl packages/python/dist/*.tar.gz

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: packages/go/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: packages/go
      - name: Consume module outside the repository
        run: |
          mkdir "$RUNNER_TEMP/go-consumer"
          cp packages/go/testdata/consumer/main.go "$RUNNER_TEMP/go-consumer/main.go"
          cd "$RUNNER_TEMP/go-consumer"
          go mod init example.com/consumer
          go mod edit -replace "github.com/alansferreira/curtail-str/packages/go=$GITHUB_WORKSPACE/packages/go"
          go get github.com/alansferreira/curtail-str/packages/go
          go run .

  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25', '27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: mvn -B -ntp -f packages/java/pom.xml verify
      - name: Consume JAR without test or runtime dependencies
        run: |
          mkdir "$RUNNER_TEMP/java-consumer"
          version=$(cat VERSION)
          javac -cp "packages/java/target/curtail-str-$version.jar" -d "$RUNNER_TEMP/java-consumer" packages/java/src/test/smoke/Consumer.java
          java -cp "packages/java/target/curtail-str-$version.jar:$RUNNER_TEMP/java-consumer" Consumer
