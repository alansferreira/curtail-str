name: Publish Go

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: packages/go/go.sum
      - name: Validate release
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after dispatch. Start a new workflow run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_VERSION=$(python scripts/release.py version)
          make release-check CONFIRM="$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Test Go module and release tooling
        run: make test-go test-release
      - name: Build Go module
        run: make build-go
      - name: Publish Go module tags
        run: python scripts/release.py publish go --confirm "$RELEASE_VERSION"
