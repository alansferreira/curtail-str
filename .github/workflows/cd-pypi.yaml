name: Publish PyPI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after dispatch. Start a new workflow run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_VERSION=$(python scripts/release.py version)
          make release-check CONFIRM="$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Install Python packaging tools
        run: |
          python -m venv .venv-release
          .venv-release/bin/python -m pip install -r requirements-release.txt
      - name: Test Python package and release tooling
        run: make test-python test-release
      - name: Build and validate Python distributions
        run: make build-python
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          : "${TWINE_PASSWORD:?Set the PYPI_TOKEN secret}"
          .venv-release/bin/python scripts/release.py publish python --confirm "$RELEASE_VERSION"
