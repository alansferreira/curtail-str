name: Publish Maven Central

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          overwrite-settings: false
      - name: Validate release
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after dispatch. Start a new workflow run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_VERSION=$(python scripts/release.py version)
          make release-check CONFIRM="$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Test Java package and release tooling
        run: make test-java test-release
      - name: Build Java package
        run: make build-java
      - name: Sign and publish to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          : "${CENTRAL_USERNAME:?Set the CENTRAL_USERNAME secret}"
          : "${CENTRAL_PASSWORD:?Set the CENTRAL_PASSWORD secret}"
          : "${MAVEN_GPG_PASSPHRASE:?Set the MAVEN_GPG_PASSPHRASE secret}"
          : "${GPG_PRIVATE_KEY:?Set the GPG_PRIVATE_KEY secret}"
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/curtail-gpg.XXXXXXXX")
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          unset GPG_PRIVATE_KEY
          python scripts/release.py publish java --confirm "$RELEASE_VERSION"
