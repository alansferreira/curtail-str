name: Publish runtime (reusable)

on:
  workflow_call:
    inputs:
      runtime:
        description: Runtime selected by the destination workflow
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_RUNTIME: ${{ inputs.runtime }}
    steps:
      - name: Require main branch and supported runtime
        run: |
          case "$RELEASE_RUNTIME" in
            node|python|java|go) ;;
            *) echo "::error::Unsupported release runtime."; exit 1 ;;
          esac
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm release commit and version
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::main changed after dispatch. Start a new workflow run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RELEASE_VERSION=$(python3 scripts/release.py version)
          make release-check CONFIRM="$RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: packages/go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          overwrite-settings: false
      - name: Set up release tools
        run: make setup-release
      - name: Test all packages
        run: make test
      - name: Build all packages
        run: make build
      - name: Publish selected packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [[ "$RELEASE_RUNTIME" == all || "$RELEASE_RUNTIME" == node ]]; then
            : "${NODE_AUTH_TOKEN:?Set the NPM_TOKEN secret}"
          fi
          if [[ "$RELEASE_RUNTIME" == all || "$RELEASE_RUNTIME" == python ]]; then
            : "${TWINE_PASSWORD:?Set the PYPI_TOKEN secret}"
          fi
          if [[ "$RELEASE_RUNTIME" == all || "$RELEASE_RUNTIME" == java ]]; then
            : "${CENTRAL_USERNAME:?Set the CENTRAL_USERNAME secret}"
            : "${CENTRAL_PASSWORD:?Set the CENTRAL_PASSWORD secret}"
            : "${MAVEN_GPG_PASSPHRASE:?Set the MAVEN_GPG_PASSPHRASE secret}"
            : "${GPG_PRIVATE_KEY:?Set the GPG_PRIVATE_KEY secret}"
            export GNUPGHOME
            GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/curtail-gpg.XXXXXXXX")
            chmod 700 "$GNUPGHOME"
            trap 'gpgconf --kill gpg-agent' EXIT
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          unset GPG_PRIVATE_KEY
          .venv-release/bin/python scripts/release.py publish "$RELEASE_RUNTIME" \
            --confirm "$RELEASE_VERSION"
